name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    branches:
      - main
      - staging
      - development
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: rehabtask-repo

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: lint
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set environment-specific variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "SERVICE_NAME=rehabtask-frontend" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.NEXT_PUBLIC_API_URL_PROD }}" >> $GITHUB_ENV
            echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}" >> $GITHUB_ENV
            echo "IDENTITY_PLATFORM_TENANT_ID=${{ secrets.NEXT_PUBLIC_IDENTITY_PLATFORM_TENANT_ID_PROD }}" >> $GITHUB_ENV
            echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_PROD }}" >> $GITHUB_ENV
            echo "IS_PROD=true" >> $GITHUB_ENV
            echo "POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> $GITHUB_ENV
            echo "POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "SERVICE_NAME=rehabtask-frontend-staging" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}" >> $GITHUB_ENV
            echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}" >> $GITHUB_ENV
            echo "IDENTITY_PLATFORM_TENANT_ID=${{ secrets.NEXT_PUBLIC_IDENTITY_PLATFORM_TENANT_ID_STAGING }}" >> $GITHUB_ENV
            echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_STAGING }}" >> $GITHUB_ENV
            echo "IS_PROD=false" >> $GITHUB_ENV
            echo "POSTHOG_KEY=" >> $GITHUB_ENV
            echo "POSTHOG_HOST=" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "SERVICE_NAME=rehabtask-frontend-dev" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}" >> $GITHUB_ENV
            echo "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV }}" >> $GITHUB_ENV
            echo "IDENTITY_PLATFORM_TENANT_ID=${{ secrets.NEXT_PUBLIC_IDENTITY_PLATFORM_TENANT_ID_DEV }}" >> $GITHUB_ENV
            echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_DEV }}" >> $GITHUB_ENV
            echo "IS_PROD=false" >> $GITHUB_ENV
            echo "POSTHOG_KEY=" >> $GITHUB_ENV
            echo "POSTHOG_HOST=" >> $GITHUB_ENV
          fi

      - name: Capture current serving revision
        run: |
          PREVIOUS_REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          echo "PREVIOUS_REVISION=$PREVIOUS_REVISION" >> $GITHUB_ENV
          echo "Previous revision: $PREVIOUS_REVISION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sanitize branch name for image tag
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "BRANCH_TAG=$BRANCH" >> $GITHUB_ENV

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/package-lock.json', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.BRANCH_TAG }}-${{ github.sha }}"
          docker buildx build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.API_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.STRIPE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }} \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }} \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ env.POSTHOG_KEY }} \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST=${{ env.POSTHOG_HOST }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_IDENTITY_PLATFORM_TENANT_ID=${{ env.IDENTITY_PLATFORM_TENANT_ID }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --platform linux/amd64 \
            --push \
            -t $IMAGE \
            .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ env.BRANCH_TAG }}-${{ github.sha }}"
          if [[ "${{ env.IS_PROD }}" == "true" ]]; then
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image $IMAGE \
              --platform managed \
              --region ${{ env.REGION }} \
              --port 3000 \
              --min-instances=1 \
              --max-instances 10 \
              --memory 512Mi \
              --cpu 1 \
              --no-traffic \
              --cpu-boost \
              --timeout=300 \
              --quiet
          else
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image $IMAGE \
              --platform managed \
              --region ${{ env.REGION }} \
              --port 3000 \
              --min-instances 0 \
              --max-instances 5 \
              --memory 512Mi \
              --cpu 1 \
              --no-traffic \
              --timeout=300 \
              --quiet
          fi

      - name: Health check and switch traffic
        run: |
          REVISION=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.latestCreatedRevisionName)")
          echo "Polling revision: $REVISION"
          for i in {1..18}; do
            STATUS=$(gcloud run revisions describe $REVISION \
              --region=${{ env.REGION }} \
              --format="value(status.conditions[0].status)")
            if [[ "$STATUS" == "True" ]]; then
              echo "Revision $REVISION is healthy."
              gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
                --region=${{ env.REGION }} \
                --to-revisions=$REVISION=100
              echo "Traffic switched. Deploy complete."
              exit 0
            fi
            echo "Attempt $i: not ready. Waiting 20s..."
            sleep 20
          done
          echo "Revision failed health check."
          if [[ -n "${{ env.PREVIOUS_REVISION }}" ]]; then
            echo "Rolling back to ${{ env.PREVIOUS_REVISION }}..."
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=${{ env.PREVIOUS_REVISION }}=100
            echo "Rolled back."
          else
            echo "No previous revision — manual intervention required."
          fi
          exit 1
